# pnpm 11 reads allowBuilds. pnpm 9 and 10 (Vercel's default for lockfile 9.0) read onlyBuiltDependencies.
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@serwist/build@9.5.15'
  - '@serwist/cli@9.5.15'
  - '@serwist/next@9.5.15'
  - '@serwist/utils@9.5.15'
  - '@serwist/webpack-plugin@9.5.15'
  - '@serwist/window@9.5.15'
  - serwist@9.5.15
